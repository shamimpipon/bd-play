
name: Toffee Playlist Auto Updater

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toffee-playlist-updater
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Playlist Updater
        run: python extractor.py

      - name: Validate Playlist Files
        run: |
          python -c "import json; d=json.load(open('toffee_playlist.json', encoding='utf-8')); assert isinstance(d.get('channels'), list), 'Invalid channels list'"
          test -s toffee_playlist.m3u
          grep -q '^#EXTM3U' toffee_playlist.m3u

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add toffee_playlist.json toffee_playlist.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes to commit."
            exit 0
          fi

          git commit -m "Auto Update Toffee Playlist [skip ci]"
          git push origin HEAD:main
